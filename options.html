<!DOCTYPE html>
<html>

<head>
    <title>LLM Translator Options</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            max-width: 600px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type='text'],
        input[type='password'],
        input[type='url'],
        input[type='number'],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 80px;
        }

        .button-container {
            margin-top: 25px;
        }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }

        button#reset {
            background-color: #dc3545;
        }

        button:hover {
            opacity: 0.9;
        }

        .slider-container {
            display: flex;
            align-items: center;
        }

        .slider-container input[type='range'] {
            flex-grow: 1;
            margin-right: 10px;
        }

        .slider-container span {
            min-width: 30px;
            text-align: right;
        }
    </style>
</head>

<body>
    <h1>LLM Translator Settings</h1>

    <!-- API Provider Management Section -->
    <h2>API Providers</h2>
    <div>
        <label for="apiProvidersList">Configured Providers:</label>
        <select id="apiProvidersList" size="5"></select>
    </div>
    <div class="button-container">
        <button id="addProviderBtn">Add New Provider</button>
        <button id="editProviderBtn">Edit Selected</button>
        <button id="deleteProviderBtn">Delete Selected</button>
        <button id="setActiveProviderBtn">Set as Active</button>
    </div>
    <div>
        Current Active Provider: <strong id="activeProviderDisplay">None</strong>
    </div>

    <hr style="margin-top: 20px; margin-bottom: 20px;">

    <!-- Add/Edit Provider Form (Initially Hidden) -->
    <div id="providerFormContainer" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #ddd;">
        <h3 id="providerFormTitle">Add New Provider</h3>
        <input type="hidden" id="editingProviderIdInput">

        <label for="providerNameInput">Provider Name:</label>
        <input type="text" id="providerNameInput" placeholder="e.g., My OpenAI GPT-4">

        <label for="providerEndpointInput">API Endpoint URL:</label>
        <input type="url" id="providerEndpointInput" placeholder="e.g., https://api.openai.com/v1/chat/completions">

        <label for="providerApiKeyInput">API Key:</label>
        <input type="password" id="providerApiKeyInput" placeholder="Enter API Key (leave blank to keep existing)">

        <label for="providerModelInput">Model Name:</label>
        <input type="text" id="providerModelInput" placeholder="e.g., gpt-4-turbo">
        
        <div>
            <input type="checkbox" id="providerStreamSupportCheckbox" style="width: auto; margin-right: 5px;">
            <label for="providerStreamSupportCheckbox" style="display: inline; margin-top: 0;">Supports Streaming</label>
        </div>

        <div class="button-container">
            <button id="saveProviderBtn">Save Provider</button>
            <button id="cancelProviderBtn">Cancel</button>
        </div>
    </div>

    <hr style="margin-top: 20px; margin-bottom: 20px;">

    <!-- System Prompt Profiles Management Section -->
    <h2>System Prompt Profiles</h2>
    <div>
        <label for="promptProfilesList">Configured Profiles:</label>
        <select id="promptProfilesList" size="5"></select>
    </div>
    <div class="button-container">
        <button id="addProfileBtn">Add New Profile</button>
        <button id="editProfileBtn">Edit Selected</button>
        <button id="deleteProfileBtn">Delete Selected</button>
        <button id="setActiveProfileBtn">Set as Active</button>
    </div>
    <div>
        Current Active Profile: <strong id="activeProfileDisplay">None</strong>
    </div>

    <hr style="margin-top: 20px; margin-bottom: 20px;">

    <!-- Add/Edit Profile Form (Initially Hidden) -->
    <div id="profileFormContainer" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #ddd;">
        <h3 id="profileFormTitle">Add New Profile</h3>
        <input type="hidden" id="editingProfileIdInput">

        <label for="profileNameInput">Profile Name:</label>
        <input type="text" id="profileNameInput" placeholder="e.g., Technical Translator">

        <label for="profilePromptInput">System Prompt:</label>
        <textarea id="profilePromptInput" placeholder="Enter system prompt text. Use {{TARGET_LANGUAGE}} where the target language should be inserted."></textarea>

        <div class="button-container">
            <button id="saveProfileBtn">Save Profile</button>
            <button id="cancelProfileBtn">Cancel</button>
        </div>
    </div>

    <hr style="margin-top: 20px; margin-bottom: 20px;">

    <!-- Glossary Management Section -->
    <h2>Glossary</h2>
    <div>
        <label for="glossaryTermsSelect">Configured Glossary Terms:</label>
        <select id="glossaryTermsSelect" size="5"></select>
    </div>
    <div class="button-container">
        <button id="addGlossaryTermBtn">Add New Term</button>
        <button id="editGlossaryTermBtn">Edit Selected Term</button>
        <button id="deleteGlossaryTermBtn">Delete Selected Term</button>
    </div>

    <hr style="margin-top: 20px; margin-bottom: 20px;">

    <!-- Add/Edit Glossary Term Form (Initially Hidden) -->
    <div id="glossaryTermFormContainer" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #ddd;">
        <h3 id="glossaryTermFormTitle">Add New Glossary Term</h3>
        <input type="hidden" id="editingGlossaryTermIdInput">

        <label for="glossaryTermInput">Term:</label>
        <input type="text" id="glossaryTermInput" placeholder="Enter source term">

        <label for="glossaryTranslationInput">Translation:</label>
        <input type="text" id="glossaryTranslationInput" placeholder="Enter target translation">
        
        <div>
            <input type="checkbox" id="glossaryCaseSensitiveCheckbox" style="width: auto; margin-right: 5px;">
            <label for="glossaryCaseSensitiveCheckbox" style="display: inline; margin-top: 0;">Case Sensitive</label>
        </div>

        <div class="button-container">
            <button id="saveGlossaryTermBtn">Save Term</button>
            <button id="cancelGlossaryTermBtn">Cancel</button>
        </div>
    </div>

    <hr style="margin-top: 20px; margin-bottom: 20px;">

    <!-- Global Settings -->
    <h2>Global Settings</h2>

    <label for="targetLanguage">Target Language:</label>
    <select id="targetLanguage">
        <option value="English">English</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Chinese">Chinese</option>
        <option value="Japanese">Japanese</option>
        <option value="Russian">Russian</option>
        <option value="Arabic">Arabic</option>
        <option value="Portuguese">Portuguese</option>
        <option value="Hindi">Hindi</option>
        <!-- Add more common languages as needed -->
    </select>

    <label for="temperature">Temperature:</label>
    <div class="slider-container">
        <input type="range" id="temperature" min="0" max="1" step="0.01">
        <span id="temperatureValue">0.8</span>
    </div>


    <label for="maxTokens">Max Tokens:</label>
    <input type="number" id="maxTokens" min="50" placeholder="e.g., 32000">

    <div class="button-container">
        <button id="saveGlobalSettingsBtn">Save Global Settings</button>
        <button id="reset">Reset to Defaults</button>
    </div>

    <script src="options.js"></script>
</body>

</html>
