<!DOCTYPE html>
<html>
<head>
    <title>LLM Translator Options</title>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 600px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type='text'], input[type='password'], input[type='url'], input[type='number'], select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea { min-height: 80px; }
        .button-container { margin-top: 25px; }
        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button#reset { background-color: #dc3545; }
        button:hover { opacity: 0.9; }
        .slider-container { display: flex; align-items: center; }
        .slider-container input[type='range'] { flex-grow: 1; margin-right: 10px; }
        .slider-container span { min-width: 30px; text-align: right; }
    </style>
</head>
<body>
    <h1>LLM Translator Settings</h1>

    <label for="apiEndpoint">API Endpoint URL:</label>
    <input type="url" id="apiEndpoint" placeholder="e.g., https://api.openai.com/v1/chat/completions">

    <label for="apiKey">API Key:</label>
    <input type="password" id="apiKey" placeholder="Enter your API Key">

    <label for="modelName">Model Name:</label>
    <input type="text" id="modelName" placeholder="e.g., gpt-4o">

    <label for="systemPrompt">System Prompt:</label>
    <textarea id="systemPrompt" placeholder="e.g., You are a helpful translation assistant. Translate the following text into {{TARGET_LANGUAGE}}."></textarea>

    <label for="targetLanguage">Target Language:</label>
    <select id="targetLanguage">
        <option value="English">English</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Chinese">Chinese</option>
        <option value="Japanese">Japanese</option>
        <option value="Russian">Russian</option>
        <option value="Arabic">Arabic</option>
        <option value="Portuguese">Portuguese</option>
        <option value="Hindi">Hindi</option>
        <!-- Add more common languages as needed -->
    </select>

    <label for="temperature">Temperature:</label>
    <div class="slider-container">
        <input type="range" id="temperature" min="0" max="1" step="0.1">
        <span id="temperatureValue">0.7</span>
    </div>


    <label for="maxTokens">Max Tokens:</label>
    <input type="number" id="maxTokens" min="50" placeholder="e.g., 2000">

    <div class="button-container">
        <button id="save">Save Settings</button>
        <button id="reset">Reset to Defaults</button>
    </div>

    <script src="options.js"></script>
</body>
</html>
